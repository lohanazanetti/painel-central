<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Central | Creator Mobile</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <h1>Painel Central</h1>
      <p class="subtitulo">Creator Mobile</p>

      <form id="form-login">
        <input type="email" id="email" placeholder="E-mail" autocomplete="username" required />
        <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required />
        <button type="submit" class="btn">Entrar</button>
        <p class="mensagem-erro" id="mensagem-erro"></p>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
